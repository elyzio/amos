<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Product Category</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/base.css">
    <link rel="stylesheet" href="../../assets/css/nav.css">
    <link rel="stylesheet" href="../../assets/css/product-grid.css">
</head>
<body>

<nav class="site-nav">
    <div class="nav-brand">
        <a href="../../index.html" class="nav-logo">
            <span class="logo-prefix">//</span>TekKom
        </a>
    </div>
    <div class="nav-crumbs">
        <a href="../../index.html" class="nav-crumb">Varanda</a>
        <span class="nav-sep">›</span>
        <a href="../index.html" class="nav-crumb">Produtu</a>
        <span class="nav-sep">›</span>
        <span class="nav-crumb nav-crumb--active">Apple</span>
    </div>
</nav>

<div class="page-wrap">

    <!-- PAGE HEADER -->
    <header class="page-header">
        <!-- <div>
            <p class="page-kicker">Product Category</p>
            <h1 class="page-title">Laptops & Ultrabooks</h1>
        </div> -->

        <div class="filter-bar">
            <span class="filter-label">Filter:</span>
            <a href="../index.html" class="filter-btn">All</a>
            <a href="../asus/index.html" class="filter-btn">Asus</a>
            <a href="../acer/index.html" class="filter-btn">Acer</a>
            <button class="filter-btn is-active">Apple</button>
        </div>
    </header>

    <!-- STATS BAR -->
    <div class="stats-bar">
        <div class="stats-item">
            <div class="stats-dot"></div>
            <span>3</span> Products
        </div>
        <!-- <div class="stats-item">Showing <span>12</span> of 24</div> -->
        <!-- <div class="stats-item">Sort: <span>Featured</span></div> -->
        <div class="stats-item">Hover card to preview video</div>
    </div>

    <!-- PRODUCT GRID -->
    <div class="product-grid">

        <!-- Macbook Neo -->
        <div class="product-card"
            data-video-local="../../assets/video/apple/macbook_neo/macbook_neo_higlight.mp4"
            data-video-drive="https://qyxqikmsmdarpxihtrzg.supabase.co/storage/v1/object/public/video/video/apple/macbook_neo/macbook_neo-highlight.mp4"
            data-video-start="4"
            data-video-end="12">    
            <div class="card-media">
                <img
                    src="../../assets/img/apple/macbook_neo/macbook_neo_1.webp"
                    alt="Macbook Neo"
                    class="card-img"
                    loading="lazy">
                <video class="card-video" muted loop playsinline preload="none"></video>
                <div class="card-scan"></div>
                <div class="card-preview-badge">PREVIEW</div>
            </div>
            <div class="card-body">
                <p class="card-brand">Apple</p>
                <h2 class="card-name">Macbook Neo</h2>
            </div>
            <a href="macbook_neo.html" class="card-link" aria-label="MacBook Neo"></a>
        </div>

        <!-- Mac Book Air -->
        <div class="product-card"
            data-video-local="../../assets/video/apple/mac_book_air/mac_book_air_higlight.mp4"
            data-video-drive="https://qyxqikmsmdarpxihtrzg.supabase.co/storage/v1/object/public/video/video/apple/mac_book_air/mac_book_air-highlight.mp4"
            data-video-start="4"
            data-video-end="12">    
            <div class="card-media">
                <img
                    src="../../assets/img/apple/mac_book_air/mac_book_air_1.png"
                    alt="Mac Book Air"
                    class="card-img"
                    loading="lazy">
                <video class="card-video" muted loop playsinline preload="none"></video>
                <div class="card-scan"></div>
                <div class="card-preview-badge">PREVIEW</div>
            </div>
            <div class="card-body">
                <p class="card-brand">Apple</p>
                <h2 class="card-name">Mac Book Air</h2>
            </div>
            <a href="mac_book_air.html" class="card-link" aria-label="Mac Book Air"></a>
        </div>

        <!-- Mac Book Pro M5 -->
        <div class="product-card"
            data-video-local="../../assets/video/apple/mac_book_pro_m5/mac_book_pro_m5_higlight.mp4"
            data-video-drive="https://qyxqikmsmdarpxihtrzg.supabase.co/storage/v1/object/public/video/video/apple/mac_book_pro_m5/mac_book_pro_m5-highlight.mp4"
            data-video-start="4"
            data-video-end="12">    
            <div class="card-media">
                <img
                    src="../../assets/img/apple/mac_book_pro_m5/mac_book_pro_m5_1.jpg"
                    alt="Mac Book Pro M5"
                    class="card-img"
                    loading="lazy">
                <video class="card-video" muted loop playsinline preload="none"></video>
                <div class="card-scan"></div>
                <div class="card-preview-badge">PREVIEW</div>
            </div>
            <div class="card-body">
                <p class="card-brand">Apple</p>
                <h2 class="card-name">Mac Book Pro M5</h2>
            </div>
            <a href="mac_book_pro_m5.html" class="card-link" aria-label="Mac Book Pro M5"></a>
        </div>


    </div><!-- /product-grid -->

    <div class="load-more-wrap">
        <button class="load-more-btn" id="loadMoreBtn">// Load More</button>
    </div>

</div><!-- /page-wrap -->

<script src="../../assets/js/product-grid.js"></script>
</body>
</html>
